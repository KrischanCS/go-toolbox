version: '3'

shopt: [ -s globstar ]

tasks:

  setup:
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest
    sources:
      - taskfile.yml

  check:
    cmds:
      - task vulncheck
      - task lint
      - task test

  monitor:
    cmds:
      - while true; do (task lint && task test) || true; echo 'sleeping...'; sleep 15; echo 'go again!';done

  test:
    cmds:
      - go test -race ./...
    sources:
      - ./**/*.go
      - taskfile.yml

  coverage:
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  lint:
    cmds:
      - golangci-lint fmt
      - golangci-lint run --output.tab.path stdout --output.tab.print-linter-name --output.tab.colors
    sources:
      - ./**/*.go
      - taskfile.yml
      - .golangci.yml

  vulncheck:
    cmds:
      - govulncheck ./...
    sources:
      - ./**/*.go
      - taskfile.yml

  deps:
    cmds:
      - go get -u ./...
      - go mod tidy
      - go mod vendor
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - taskfile.yml
      - .golangci.yml
